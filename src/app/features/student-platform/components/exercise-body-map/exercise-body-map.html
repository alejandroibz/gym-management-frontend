<section class="exercise-body-map">
  <header>
    <span>Anatomia</span>
    <strong>Musculos trabajados</strong>
  </header>

  <div class="map-canvas">
    <img src="/images/body-muscle-map.png" alt="Mapa corporal muscular">
    <svg viewBox="0 0 1664 1248" aria-hidden="true">
      <g stroke-linejoin="round" stroke-width="3" transform="translate(0 155)">
        @for (area of activeAreas(); track area.key) {
          @for (path of area.paths; track path) {
            <path
              [attr.d]="path"
              fill="rgba(93, 143, 240, .58)"
              stroke="#4478de"></path>
          }
        }
      </g>
    </svg>
  </div>

  <div class="active-zone-list">
    @for (area of activeAreas(); track area.key) {
      <span>{{ area.label }}</span>
    } @empty {
      <small>Sin musculos asociados al mapa.</small>
    }
  </div>
</section>
